# Fly.io configuration for AmazonFinds
# Deploy: fly deploy
# First-time setup: fly launch --no-deploy, then fly secrets set DATABASE_URL=...

app = "amazonfinds"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    # DATABASE_URL is passed at build time for static generation.
    # Set it with: fly secrets set DATABASE_URL="postgresql://..."
    DATABASE_URL = ""

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
