name: Daily Trend Detection

on:
  schedule:
    # Runs every day at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  detect-and-scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run trend detection
        run: npx ts-node --project tsconfig.scripts.json scripts/run-daily.ts
        env:
          NODE_ENV: production

      - name: Check for changes
        id: check-changes
        run: |
          git diff --quiet public/data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push new scaffolds
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --global user.name "AmazonFinds Bot"
          git config --global user.email "bot@amazonfinds.com"
          git add public/data/
          git commit -m "chore: scaffold new trending categories [$(date +%Y-%m-%d)]"
          git push

      - name: Trigger site revalidation
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          curl -X POST \
            -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            ${{ secrets.SITE_URL }}/api/revalidate || true
        continue-on-error: true

      - name: No changes summary
        if: steps.check-changes.outputs.changed != 'true'
        run: echo "No new trending categories detected today."
