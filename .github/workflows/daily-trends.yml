name: Daily Product Refresh

on:
  schedule:
    # Runs every day at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run daily maintenance (trends + product refresh)
        run: npx ts-node --project tsconfig.scripts.json scripts/run-daily.ts
        env:
          NODE_ENV: production
          AMAZON_ACCESS_KEY_ID: ${{ secrets.AMAZON_ACCESS_KEY_ID }}
          AMAZON_SECRET_ACCESS_KEY: ${{ secrets.AMAZON_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_AFFILIATE_TAG: ${{ secrets.NEXT_PUBLIC_AFFILIATE_TAG }}

      - name: Check for changes
        id: check-changes
        run: |
          git diff --quiet src/data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --global user.name "AmazonFinds Bot"
          git config --global user.email "bot@amazonfinds.com"
          git add src/data/
          git commit -m "chore: refresh product data [$(date +%Y-%m-%d)]"
          git push

      - name: Trigger site revalidation
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          curl -X POST \
            -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            ${{ secrets.SITE_URL }}/api/revalidate || true
        continue-on-error: true

      - name: No changes summary
        if: steps.check-changes.outputs.changed != 'true'
        run: echo "No product data changes today."
